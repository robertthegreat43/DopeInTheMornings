<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dope In The Mornings NBA DFS</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0b0b0b;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#121212;
            padding:15px;
            border-bottom:3px solid #27ae60;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .navbar a{
            text-decoration:none;
            color:white;
            background:#222;
            padding:10px 15px;
            border-radius:5px;
            transition:.3s;
        }

        .navbar a:hover{
            background:#27ae60;
            color:black;
        }

        .wrapper{
            padding:25px;
        }

        .header{
            text-align:center;
            margin-bottom:30px;
        }

        .header h1{
            color:#27ae60;
            margin-bottom:10px;
        }

        .header p{
            color:#ccc;
        }

        .controls{
            text-align:center;
            margin-bottom:25px;
        }

        .generate-btn{
            background:#27ae60;
            color:white;
            border:none;
            padding:14px 24px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        .generate-btn:hover{
            background:#2ecc71;
        }

        .results{
            max-width:1200px;
            margin:auto;
        }

        .lineup-card{
            background:#151515;
            border:1px solid #333;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.4);
        }

        .lineup-title{
            color:#27ae60;
            margin-bottom:20px;
        }

        .player-row{
            display:grid;
            grid-template-columns:
                80px
                250px
                120px
                120px
                120px;
            padding:12px;
            border-bottom:1px solid #333;
        }

        .player-row.header-row{
            background:#222;
            font-weight:bold;
        }

        .totals{
            margin-top:20px;
            padding:20px;
            background:#101010;
            border-radius:8px;
        }

        .error{
            color:#ff4d4d;
            background:#220000;
            padding:20px;
            border-radius:8px;
        }

        .loading{
            color:#27ae60;
            text-align:center;
            font-size:20px;
        }

        @media(max-width:900px){

            .player-row{
                grid-template-columns:1fr;
                gap:5px;
            }

        }

    </style>
</head>
<body>

<nav class="navbar">

    <a href="/DopeInTheMornings/">NFL Dashboard</a>

    <a href="/nba_lines/">NBA Dashboard</a>

    <a href="/pg/">PG</a>

    <a href="/sg/">SG</a>

    <a href="/f/">F</a>

    <a href="/pf/">PF</a>

    <a href="/center/">Center</a>

    <a href="/full_lineup/">Training</a>

    <a href="/logout/">Logout</a>

</nav>

<div class="wrapper">

    <div class="header">

        <h1>
            🏀 Dope In The Mornings NBA DFS
        </h1>

        <p>
            DraftKings NBA Lineup Generator
        </p>

    </div>

    <div class="controls">

        <button
            id="nbaGenerateBtn"
            class="generate-btn"
        >
            Generate NBA Lineup
        </button>

    </div>

    <div
        id="lineupResults"
        class="results"
    >
    </div>

</div>

<script>

async function generateNBALineup(){

    const results =
        document.getElementById(
            "lineupResults"
        );

    results.innerHTML =
        '<div class="loading">Generating NBA Lineup...</div>';

    try{

        const response =
            await fetch(
                "/api/nba/generatelines/"
            );

        const data =
            await response.json();

        if(data.error){

            results.innerHTML = `
                <div class="error">
                    <strong>Error</strong><br>
                    ${data.error}
                </div>
            `;

            return;
        }

        let html = `
            <div class="lineup-card">

                <h2 class="lineup-title">
                    DraftKings NBA Lineup
                </h2>

                <div class="player-row header-row">
                    <div>Slot</div>
                    <div>Name</div>
                    <div>Position</div>
                    <div>Salary</div>
                    <div>Projection</div>
                </div>
        `;

        data.players.forEach(player=>{

            html += `

                <div class="player-row">

                    <div>
                        ${player.slot}
                    </div>

                    <div>
                        ${player.name}
                    </div>

                    <div>
                        ${player.position}
                    </div>

                    <div>
                        $${player.salary}
                    </div>

                    <div>
                        ${player.projection}
                    </div>

                </div>

            `;

        });

        html += `

            <div class="totals">

                <h3>
                    Salary:
                    $${data.total_salary}
                </h3>

                <br>

                <h3>
                    Projection:
                    ${data.total_projection}
                </h3>

            </div>

        </div>

        `;

        results.innerHTML = html;

    }
    catch(error){

        console.error(error);

        results.innerHTML = `
            <div class="error">
                Failed to connect to NBA API.
            </div>
        `;
    }

}

document
.getElementById("nbaGenerateBtn")
.addEventListener(
    "click",
    generateNBALineup
);

</script>

</body>
</html>
