<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>NBA Lineups</title>
    <style>
      body { margin: 0; padding: 0; background: #0d0d0d; color: #fff; font-family: Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
      #top-nav { width: 100%; background: #111; border-bottom: 2px solid #222; padding: 10px; position: fixed; top: 0; left: 0; z-index: 1000; }
      #top-nav a { color: #fff; text-decoration: none; padding: 8px 15px; background: #28a745; border-radius: 6px; margin-right: 8px; }
      #dfs-sidebar { width: 380px; background: #111; border-right: 2px solid #222; padding: 20px; overflow-y: auto; margin-top: 50px; }
      #dfs-sidebar h2, .lineup-card h3 { color: #0f0; }
      #generate-btn { width: 100%; padding: 12px; background: #28a745; border: 0; border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 20px; }
      .lineup-card { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
      .player-row, .news-item { padding: 8px 0; border-bottom: 1px solid #222; }
      #main-content { flex: 1; padding: 20px; background: #0d0d0d; margin-top: 50px; overflow-y: auto; }
      #news-section { background: #111; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    </style>
  </head>
  <body>
    <div id="top-nav">
      <a href="/DopeInTheMornings/">NFL</a><a href="/pg/">PG</a><a href="/sg/">SG</a><a href="/f/">F</a><a href="/pf/">PF</a><a href="/center/">C</a><a href="/register/">Register</a><a href="/login/">Login</a>
      <form action="/logout/" method="post" style="display:inline;">{% csrf_token %}<button type="submit">Logout</button></form>
    </div>
    <div id="dfs-sidebar">
      <h2>NBA Lineups</h2>
      <button id="generate-btn" onclick="generateLineups()">Generate NBA Lineup</button>
      <div id="lineup-results"></div>
    </div>
    <div id="main-content">
      <h1>NBA Dashboard</h1>
      <section id="news-section"><h2>Latest NBA News</h2><div id="news-container">Loading news…</div></section>
    </div>
    <script>
      async function generateLineups() {
        const container = document.getElementById("lineup-results");
        container.textContent = "Generating lineup…";
        try {
          const response = await fetch("/api/nba/generatelines/");
          const data = await response.json();
          if (!response.ok || data.error) throw new Error(data.error || "Lineup generation failed.");
          const card = document.createElement("div");
          card.className = "lineup-card";
          const heading = document.createElement("h3");
          heading.textContent = "Generated NBA Lineup";
          card.appendChild(heading);
          const totals = document.createElement("p");
          totals.textContent = `Total Salary: $${data.total_salary} | Total Projection: ${data.total_projection}`;
          card.appendChild(totals);
          for (const player of data.players) {
            const row = document.createElement("div");
            row.className = "player-row";
            row.textContent = `${player.slot} — ${player.name} (${player.position}) — $${player.salary} | ${player.projection}`;
            card.appendChild(row);
          }
          container.replaceChildren(card);
        } catch (error) {
          container.textContent = error.message;
        }
      }

      async function loadNews() {
        const container = document.getElementById("news-container");
        try {
          const response = await fetch("/nba-news/");
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not load NBA news.");
          if (!data.news || data.news.length === 0) {
            container.textContent = "No NBA news available.";
            return;
          }
          container.replaceChildren();
          for (const article of data.news) {
            const item = document.createElement("div");
            item.className = "news-item";
            const title = document.createElement("strong");
            title.textContent = article.title;
            const source = document.createElement("em");
            source.textContent = ` — ${article.source}`;
            const snippet = document.createElement("p");
            snippet.textContent = article.snippet;
            const link = document.createElement("a");
            link.href = article.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Read more";
            item.append(title, source, document.createElement("br"), snippet, link);
            container.appendChild(item);
          }
        } catch (error) {
          container.textContent = error.message;
        }
      }
      loadNews();
    </script>
  </body>
</html>
