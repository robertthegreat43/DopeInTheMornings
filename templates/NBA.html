<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA DFS Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0d0d0d;
            color:white;
            font-family:Arial,sans-serif;
        }

        .navbar{
            background:#111;
            padding:15px;
            border-bottom:3px solid #34ce57;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            padding:10px 15px;
            background:#222;
            border-radius:6px;
        }

        .navbar a:hover{
            background:#34ce57;
            color:black;
        }

        .container{
            padding:25px;
        }

        .header{
            font-size:32px;
            font-weight:bold;
            margin-bottom:20px;
            color:#34ce57;
        }

        .button-row{
            margin-bottom:20px;
        }

        button{
            border:none;
            background:#34ce57;
            color:black;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#49e66d;
        }

        .lineup-card{
            background:#181818;
            border:1px solid #333;
            border-radius:8px;
            padding:20px;
        }

        .player{
            display:flex;
            justify-content:space-between;
            padding:8px 0;
            border-bottom:1px solid #333;
        }

        .player:last-child{
            border-bottom:none;
        }

        .totals{
            margin-top:20px;
            font-size:18px;
            color:#34ce57;
        }

        .error{
            color:red;
            font-weight:bold;
        }
    </style>

</head>
<body>

<nav class="navbar">

    <a href="/DopeInTheMornings/">NFL Dashboard</a>
    <a href="/nba_lines/">NBA Dashboard</a>

    <a href="/pg/">PG</a>
    <a href="/sg/">SG</a>
    <a href="/f/">F</a>
    <a href="/pf/">PF</a>
    <a href="/center/">CENTER</a>

    <a href="/login/">Login</a>
    <a href="/logout/">Logout</a>

</nav>

<div class="container">

    <div class="header">
        NBA DFS LINEUP GENERATOR
    </div>

    <div class="button-row">
        <button id="nbaButton">
            Generate NBA Lineup
        </button>
    </div>

    <div id="results">
        Click Generate NBA Lineup
    </div>

</div>

<script>

async function generateNBALineup(){

    const results =
        document.getElementById("results");

    results.innerHTML =
        "<h3>Generating NBA lineup...</h3>";

    try{

        const response =
            await fetch(
                "/api/nba/generatelines/"
            );

        const data =
            await response.json();

        if(data.error){

            results.innerHTML =
                `<div class="error">
                    ${data.error}
                </div>`;

            return;
        }

        let html = "";

        html += `
            <div class="lineup-card">
                <h2>DraftKings NBA Lineup</h2>
                <br>
        `;

        data.players.forEach(player=>{

            html += `
                <div class="player">
                    <div>
                        <strong>${player.slot}</strong>
                        -
                        ${player.name}
                    </div>

                    <div>
                        $${player.salary}
                        |
                        ${player.projection}
                    </div>
                </div>
            `;

        });

        html += `
            <div class="totals">

                Total Salary:
                $${data.total_salary}

                <br><br>

                Projected Points:
                ${data.total_projection}

            </div>
        `;

        html += "</div>";

        results.innerHTML = html;

    }
    catch(error){

        console.error(error);

        results.innerHTML =
            `<div class="error">
                Failed to connect to NBA API.
            </div>`;
    }
}

document
.getElementById("nbaButton")
.addEventListener(
    "click",
    generateNBALineup
);

</script>

</body>
</html>
