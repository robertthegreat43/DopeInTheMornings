<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forward (F)</title>
    <style>
        body { background:#111; color:#fff; font-family:Arial; padding:20px; }
        .dope-title { text-align:right; font-size:2rem; margin-bottom:20px; }
        .position-container { background:#1e1e1e; padding:20px; border-radius:10px; width:90%; margin:auto; }
        textarea { width:100%; height:120px; margin-bottom:10px; border-radius:6px; padding:10px; font-size:1rem; }
        button { background:#00aaff; border:none; padding:10px 20px; border-radius:6px; color:#fff; cursor:pointer; margin-bottom:20px; }
        .collapsible-section { margin-top:20px; }
        .collapsible-toggle { background:#444; padding:10px; border-radius:6px; cursor:pointer; width:100%; text-align:left; }
        .collapsible-content { display:none; background:#222; padding:15px; margin-top:10px; border-radius:6px; }
    </style>
</head>

<body>
<div id="top-nav">
    <a href="/NBA/">Generate Lines</a>
    <a href="/full_lineup/">ML Training</a>
    <a href="/pg/">PG</a>
    <a href="/sg/">SG</a>
    <a href="/f/">F</a>
    <a href="/pf/">PF</a>
    <a href="/c/">Center</a>
    <a href="/flex/">FLEX</a>
    <a href="/register/">Register</a>
    <a href="/login/">Login</a>

    <form action="/logout/" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" style="
        background:#28a745;
        border:none;
        padding:8px 15px;
        border-radius:6px;
        color:#fff;
        cursor:pointer;
    ">Logout</button>
</form>

</div>

<h1 class="dope-title">Forwards (F)</h1>

<div class="position-container">

    <h2 style="text-align:right;">Upload Winning Forward Lineup</h2>
    <textarea id="FWinning" placeholder="Paste Forward lineup JSON here"></textarea>
    <button onclick="train_f()">Submit Winning F Lineup</button>

    <h2 style="text-align:right;">Upload Losing F Lineup</h2>
    <textarea id="teLosing" placeholder="Paste Forward lineup JSON here"></textarea>
    <button onclick="serialize_f()">Submit Losing TE Lineup</button>

    <div class="collapsible-section">
        <button class="collapsible-toggle" onclick="toggle_f()">Show Forwards Serialized Entries</button>
        <div class="collapsible-content" id="F_Entries"></div>
    </div>

</div>

<script>
async function train_f() {
    const raw = document.getElementById("teWinning").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        F: parsed
    };

    await fetch("/train/f/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("F winning lineup submitted");
}


async function serialize_f() {
    const raw = document.getElementById("teLosing").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        F: parsed
    };

    await fetch("/serialize/f/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("Forward losing lineup submitted");
}


function toggle_f() {
    const content = document.getElementById("teEntries");
    content.style.display = content.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
