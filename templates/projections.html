<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Projections | Dope In The Mornings</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0d0d0d; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; background: #111; border-bottom: 2px solid #222; }
    nav a, button { padding: 9px 13px; border: 0; border-radius: 6px; background: #28a745; color: #fff; text-decoration: none; font: inherit; }
    nav a:hover, button:hover { background: #34ce57; color: #000; }
    main { width: min(900px, 100%); margin: 0 auto; padding: 28px 20px; }
    h1 { margin: 0 0 8px; }
    .intro { color: #bbb; margin: 0 0 24px; }
    .panel, .team-card { padding: 20px; margin-bottom: 18px; border: 1px solid #333; border-radius: 10px; background: #151515; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { min-height: 42px; padding: 9px 12px; border: 1px solid #444; border-radius: 6px; background: #1d1d1d; color: inherit; font: inherit; }
    .team-input { width: 100%; margin-bottom: 18px; }
    .game-count { width: 120px; margin-bottom: 18px; }
    .score-list { display: grid; gap: 10px; }
    .score-row { display: flex; align-items: center; gap: 10px; }
    .score-row label { width: 75px; margin: 0; color: #ccc; }
    .score-row input { width: 160px; }
    button { cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .error { min-height: 22px; color: #ff8b8b; margin: 12px 0 0; }
    .team-card h3 { margin: 0 0 8px; color: #9be7a7; }
    .projection-value { font-size: 1.25rem; font-weight: 700; }
    .score-summary, .empty { color: #aaa; }
    @media (max-width: 520px) { main { padding: 22px 14px; } .panel, .team-card { padding: 16px; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="/DopeInTheMornings/">Dashboard</a>
    <a href="/projections/">Team Projections</a>
  </nav>
  <main>
    <h1>Team Projections</h1>
    <p class="intro">Enter a team name, number of games, and each game score to estimate the next score.</p>
    <form id="projection-form" class="panel" action="{% url 'projections' %}" method="post">
      {% csrf_token %}
      <label for="team-name">Team name (up to 20 characters)</label>
      <input class="team-input" id="team-name" name="team_name" type="text" maxlength="20" required>
      <label for="games-played">Number of games (1–7)</label>
      <input class="game-count" id="games-played" name="games_played" type="number" min="1" max="7" step="1" value="1" required>
      <h2>Game scores</h2>
      <div id="score-list" class="score-list"></div>
      <p><button id="submit-button" type="submit">Calculate projection</button></p>
      <p id="form-error" class="error" role="alert" aria-live="assertive"></p>
    </form>
    <section aria-live="polite" aria-label="Projection results">
      <h2>Projection results</h2>
      <p id="empty-results" class="empty">Your calculated team projections will appear here.</p>
      <div id="team-results"></div>
    </section>
  </main>
  <script>
    const form = document.getElementById("projection-form");
    const gamesInput = document.getElementById("games-played");
    const scoreList = document.getElementById("score-list");
    const errorMessage = document.getElementById("form-error");
    const results = document.getElementById("team-results");
    const emptyResults = document.getElementById("empty-results");
    const submitButton = document.getElementById("submit-button");

    function updateScoreInputs() {
      const count = Number(gamesInput.value);
      scoreList.replaceChildren();
      if (!Number.isInteger(count) || count < 1 || count > 7) return;
      for (let game = 1; game <= count; game += 1) {
        const row = document.createElement("div");
        row.className = "score-row";
        const label = document.createElement("label");
        label.htmlFor = `score-${game}`;
        label.textContent = `Game ${game}`;
        const score = document.createElement("input");
        score.id = `score-${game}`;
        score.name = "scores";
        score.type = "number";
        score.min = "0";
        score.step = "1";
        score.required = true;
        score.setAttribute("aria-label", `Game ${game} score`);
        row.append(label, score);
        scoreList.appendChild(row);
      }
    }

    gamesInput.addEventListener("input", () => {
      errorMessage.textContent = "";
      updateScoreInputs();
    });
    updateScoreInputs();

    form.addEventListener("submit", async event => {
      event.preventDefault();
      errorMessage.textContent = "";
      if (!form.reportValidity()) return;
      submitButton.disabled = true;
      submitButton.textContent = "Calculating…";
      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { "X-Requested-With": "XMLHttpRequest" }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Projection request failed.");
        const card = document.createElement("article");
        card.className = "team-card";
        const heading = document.createElement("h3");
        heading.textContent = data.team_name;
        const games = document.createElement("p");
        games.textContent = `Games played: ${data.games_played}`;
        const projection = document.createElement("p");
        projection.className = "projection-value";
        projection.textContent = `Projected next-game score: ${Number(data.projection).toFixed(2)}`;
        const summary = document.createElement("p");
        summary.className = "score-summary";
        summary.textContent = `Scores entered: ${data.scores.join(", ")}`;
        card.append(heading, games, projection, summary);
        results.prepend(card);
        emptyResults.hidden = true;
      } catch (error) {
        errorMessage.textContent = error.message || "Could not calculate projection.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Calculate projection";
      }
    });
  </script>
</body>
</html>
