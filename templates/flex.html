<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flex Position (FLEX)</title>
    <style>
        body { background:#111; color:#fff; font-family:Arial; padding:20px; }
        .dope-title { text-align:right; font-size:2rem; margin-bottom:20px; }
        .position-container { background:#1e1e1e; padding:20px; border-radius:10px; width:90%; margin:auto; }
        textarea { width:100%; height:120px; margin-bottom:10px; border-radius:6px; padding:10px; font-size:1rem; }
        button { background:#00aaff; border:none; padding:10px 20px; border-radius:6px; color:#fff; cursor:pointer; margin-bottom:20px; }
        .collapsible-section { margin-top:20px; }
        .collapsible-toggle { background:#444; padding:10px; border-radius:6px; cursor:pointer; width:100%; text-align:left; }
        .collapsible-content { display:none; background:#222; padding:15px; margin-top:10px; border-radius:6px; }
    </style>
</head>

<body>
<div id="top-nav">
    <a href="/DopeInTheMornings/">Generate Lines</a>
    <a href="/full_lineup/">ML Training</a>
    <a href="/qb/">QB</a>
    <a href="/rb/">RB</a>
    <a href="/te/">TE</a>
    <a href="/dst/">DST</a>
    <a href="/wr/">WR</a>
    <a href="/flex/">FLEX</a>
    <a href="/register/">Register</a>
    <a href="/login/">Login</a>

    <form action="/logout/" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" style="
        background:#28a745;
        border:none;
        padding:8px 15px;
        border-radius:6px;
        color:#fff;
        cursor:pointer;
    ">Logout</button>
</form>

</div>

<h1 class="dope-title">Flex Position (FLEX)</h1>

<div class="position-container">

    <h2 style="text-align:right;">Upload Winning FLEX Lineup</h2>
    <textarea id="flexWinning" placeholder="Paste FLEX lineup JSON here"></textarea>
    <button onclick="trainFLEX()">Submit Winning FLEX Lineup</button>

    <h2 style="text-align:right;">Upload Losing FLEX Lineup</h2>
    <textarea id="flexLosing" placeholder="Paste FLEX lineup JSON here"></textarea>
    <button onclick="serializeFLEX()">Submit Losing FLEX Lineup</button>

    <div class="collapsible-section">
        <button class="collapsible-toggle" onclick="toggleFLEX()">Show FLEX Serialized Entries</button>
        <div class="collapsible-content" id="flexEntries"></div>
    </div>

</div>

<script>
async function trainFLEX() {
    const raw = document.getElementById("flexWinning").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        Flex: parsed
    };

    await fetch("/train/flex/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("flex winning lineup submitted");
}
async function serializeFLEX() {
    const raw = document.getElementById("flexLosing").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        FLEX: parsed
    };

    await fetch("/serialize/flex/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("FLEX losing lineup submitted");
}


</script>

</body>
</html>
