<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PointGuard (PG)</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .dope-title {
            text-align: right; /* QB title aligned right */
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .position-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 10px;
            border-radius: 6px;
            padding: 10px;
            font-size: 1rem;
        }

        button {
            background: #00aaff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .collapsible-section {
            margin-top: 20px;
        }

        .collapsible-toggle {
            background: #444;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .collapsible-content {
            display: none;
            background: #222;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div id="top-nav">
      <a href="/NBA/">Generate Lines</a>
    <a href="/full_lineup/">ML Training</a>
    <a href="/pg/">PG</a>
    <a href="/sg/">SG</a>
    <a href="/f/">F</a>
    <a href="/pf/">PF</a>
    <a href="/c/">Center</a>
    <a href="/flex/">FLEX</a>
    <a href="/register/">Register</a>
    <a href="/login/">Login</a>

    <form action="/logout/" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" style="
        background:#28a745;
        border:none;
        padding:8px 15px;
        border-radius:6px;
        color:#fff;
        cursor:pointer;
    ">Logout</button>
</form>

</div>

<h1 class="dope-title">Point Guards (PG)</h1>

<div class="position-container">

    <h2 style="text-align:right;">Upload Winning PG Lineup</h2>
    <textarea id="qbWinning" placeholder="Paste PG lineup JSON here"></textarea>
    <button onclick="trainPG()">Submit Winning PG Lineup</button>

    <h2 style="text-align:right;">Upload Losing PG Lineup</h2>
    <textarea id="qbLosing" placeholder="Paste QB lineup JSON here"></textarea>
    <button onclick="serializePG()">Submit Losing PG Lineup</button>

    <div class="collapsible-section">
        <button class="collapsible-toggle" onclick="toggleQB()">Show PG Serialized Entries</button>
        <div class="collapsible-content" id="qbEntries"></div>
    </div>

</div>
<script>
async function trainPG() {
    const raw = document.getElementById("qbWinning").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        QB: parsed
    };

    await fetch("/train/pg/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("QB winning lineup submitted");
}

async function trainPG() {
    const raw = document.getElementById("qbWinning").value;

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch {
        alert("Invalid JSON. Make sure your lineup is valid JSON.");
        return;
    }

    // FIX: wrap the parsed data inside a QB object
    const lineup = {
        QB: parsed
    };

    await fetch("/train/pg/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ lineup })
    });

    alert("PG winning lineup submitted");
}


function toggleQB() {
    const content = document.getElementById("pgEntries");
    content.style.display = content.style.display === "block" ? "none" : "block";
}
</script>


</body>
</html>
