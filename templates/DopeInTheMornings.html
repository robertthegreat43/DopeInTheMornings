<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dope In The Mornings</title>
    <style>
      body { margin: 0; padding: 0; background: #0d0d0d; color: #fff; font-family: Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
      #top-nav { width: 100%; background: #111; border-bottom: 2px solid #222; padding: 10px; position: fixed; top: 0; left: 0; z-index: 1000; display: flex; flex-wrap: wrap; gap: 8px; }
      #top-nav a { color: #fff; text-decoration: none; padding: 8px 12px; background: #28a745; border-radius: 6px; transition: 0.2s; }
      #top-nav a:hover { background: #34ce57; color: #000; }
      #dfs-sidebar { width: 380px; flex: 0 0 380px; box-sizing: border-box; background: #111; border-right: 2px solid #222; padding: 20px; overflow-y: auto; margin-top: 70px; }
      #dfs-sidebar h2 { margin-top: 0; font-size: 22px; letter-spacing: 1px; color: #0f0; }
      #generate-btn { width: 100%; padding: 12px; background: #28a745; border: none; border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 20px; }
      #generate-btn:disabled { opacity: 0.65; cursor: wait; }
      .lineup-card { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
      .lineup-card h3 { margin: 0 0 10px 0; color: #0f0; }
      .player-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid #222; }
      .player-row:last-child { border-bottom: none; }
      #main-content { flex: 1; min-width: 0; padding: 20px; background: #0d0d0d; margin-top: 70px; overflow-y: auto; }
      #header { font-size: 28px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; }
      #news-section { background: #111; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
      .news-item { border-bottom: 1px solid #333; padding: 10px 0; }
      .news-item:last-child { border-bottom: none; }
      @media (max-width: 760px) {
        body { overflow: auto; height: auto; min-height: 100vh; display: block; }
        #top-nav { position: sticky; }
        #dfs-sidebar { width: 100%; margin-top: 0; border-right: 0; border-bottom: 2px solid #222; }
        #main-content { margin-top: 0; }
      }
    </style>
  </head>
  <body>
    <nav id="top-nav" aria-label="Main navigation">
      <a href="/full_lineup/">ML Training</a>
      <a href="/qb/">QB</a>
      <a href="/rb/">RB</a>
      <a href="/wr/">WR</a>
      <a href="/te/">TE</a>
      <a href="/dst/">DST</a>
      <a href="/flex/">FLEX</a>
      <a href="/nba_lines/">NBA Lineups</a>
      <a href="/pg/">NBA PG</a>
      <a href="/sg/">NBA SG</a>
      <a href="/f/">NBA F</a>
      <a href="/pf/">NBA PF</a>
      <a href="/center/">NBA C</a>
      <a href="/register/">Register</a>
      <a href="/login/">Login</a>
      <a href="/logout/">Logout</a>
    </nav>

    <aside id="dfs-sidebar">
      <h2>NFL DFS Lineups</h2>
      <button id="generate-btn" type="button" onclick="generateLineups()">Generate New Lineup</button>
      <div id="lineup-results" aria-live="polite"></div>
    </aside>

    <main id="main-content">
      <div id="header">Dope In The Mornings</div>
      <section id="news-section">
        <h2>Latest Sports News</h2>
        <div id="news-container" aria-live="polite">Loading sports news…</div>
      </section>
    </main>

    <script>
      async function generateLineups() {
        const container = document.getElementById("lineup-results");
        const button = document.getElementById("generate-btn");
        button.disabled = true;
        container.textContent = "Generating lineup…";
        try {
          const response = await fetch("/api/generatelines/");
          const data = await response.json();
          if (!response.ok || data.error) {
            container.replaceChildren();
            const card = document.createElement("div");
            card.className = "lineup-card";
            const heading = document.createElement("h3");
            heading.textContent = "Lineup unavailable";
            const message = document.createElement("p");
            message.textContent = data.error || `Request failed (${response.status}).`;
            card.append(heading, message);
            if (data.position_counts) {
              const counts = document.createElement("p");
              counts.textContent = "Players loaded by position: " + Object.entries(data.position_counts).map(([position, count]) => `${position}: ${count}`).join(" · ");
              card.appendChild(counts);
            }
            container.appendChild(card);
            return;
          }

          const card = document.createElement("div");
          card.className = "lineup-card";
          const heading = document.createElement("h3");
          heading.textContent = "Generated NFL Lineup";
          const totals = document.createElement("p");
          totals.textContent = `Total Salary: $${data.total_salary} | Total Projection: ${data.total_projection}`;
          card.append(heading, totals);
          (data.players || []).forEach(player => {
            const row = document.createElement("div");
            row.className = "player-row";
            const name = document.createElement("span");
            name.textContent = `${player.position || player.slot} - ${player.name}`;
            const stats = document.createElement("span");
            stats.textContent = `$${player.salary} | ${player.projection}`;
            row.append(name, stats);
            card.appendChild(row);
          });
          container.replaceChildren(card);
        } catch (error) {
          console.error("Lineup generation error:", error);
          container.textContent = "Could not reach the lineup service. Please try again.";
        } finally {
          button.disabled = false;
        }
      }

      async function loadNews() {
        const container = document.getElementById("news-container");
        try {
          const response = await fetch("/get_sports_news/?t=" + Date.now());
          const data = await response.json();
          if (!response.ok || data.error) throw new Error(data.error || `Request failed (${response.status}).`);
          if (!Array.isArray(data.news) || data.news.length === 0) {
            container.textContent = "No sports news available.";
            return;
          }
          container.replaceChildren();
          data.news.forEach(article => {
            const item = document.createElement("div");
            item.className = "news-item";
            const title = document.createElement("strong");
            title.textContent = article.title || "Sports news";
            const source = document.createElement("em");
            source.textContent = article.source || "";
            const link = document.createElement("a");
            link.href = article.url || "#";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.style.color = "#34ce57";
            link.textContent = "Read more";
            item.append(title, document.createElement("br"), source, document.createElement("br"), document.createTextNode(article.snippet || ""), document.createElement("br"), link);
            container.appendChild(item);
          });
        } catch (error) {
          console.error("Sports news error:", error);
          container.textContent = "Error loading sports news.";
        }
      }

      loadNews();
    </script>
  </body>
</html>
